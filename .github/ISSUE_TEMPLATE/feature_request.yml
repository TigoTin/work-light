name: Feature request
description: Suggest a focused improvement for Work Light.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow would this improve?
      placeholder: I want to distinguish multiple Codex sessions more clearly.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the smallest useful version of the change.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional. Mention workarounds or other designs you tried.
  - type: checkboxes
    id: boundaries
    attributes:
      label: Scope check
      options:
        - label: I understand Work Light observes Codex Hooks and does not approve or control Codex actions.
          required: true
        - label: I understand approval/control workflows should use Codex app-server instead.
          required: true
